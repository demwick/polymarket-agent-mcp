name: Tag and release

on:
  pull_request:
    branches: [main]
    types: [closed]
  # Lets a partially completed release be finished without a second merge —
  # every step below is a no-op when its result already exists.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.title, 'Release v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Create and push tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - run: npm run build
      - run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "polymarket-agent-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "${VERSION} is already on npm, skipping publish"
            exit 0
          fi
          npm publish --provenance --access public

      - name: Pack tarball for release
        id: pack
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign tarball (keyless)
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          cosign sign-blob --yes \
            --bundle "${TARBALL}.bundle" \
            "${TARBALL}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.bundle

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -ne 0 ] && echo "$OUTPUT" | grep -qi "already exists"; then
            echo "This version is already in the registry, nothing to do"
            exit 0
          fi
          exit $CODE

      - name: Summary
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          {
            echo "## Released v${VERSION}"
            echo "- Tagged v${VERSION}"
            echo "- Published to npm"
            echo "- GitHub Release created"
            echo "- Published to MCP Registry"
          } >> $GITHUB_STEP_SUMMARY
